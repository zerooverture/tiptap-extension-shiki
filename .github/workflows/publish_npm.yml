name: Publish to npm

on:
  push:
    branches:
      # 触发ci/cd的代码分支
      - master
# 必须添加这个权限，否则无法获取临时身份证明
permissions:
  contents: read
  id-token: write 
jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run build

      - name: Publish to NPM
        run: npm publish
