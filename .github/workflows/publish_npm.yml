name: Publish to npm

on:
  push:
    branches:
      # 触发ci/cd的代码分支
      - master
# 必须添加这个权限，否则无法获取临时身份证明
permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm publish
